[project]
name = "voice-hold-engine"
version = "0.1.0"
description = "Offline speech-to-text engine for the Voice Hold GNOME Shell extension (D-Bus service)."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
authors = [{name = "Julien Griffit"}]
dependencies = [
    "sherpa-onnx>=1.12",
    "numpy>=1.26",
    "dbus-fast>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
voice-hold-engine = "voice_hold_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_hold_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
